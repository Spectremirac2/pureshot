<!doctype html><html><body style="margin:0;background:#222"><canvas id="c" width="1200" height="400"></canvas>
<script type="module">
import * as THREE from 'three';
import { loadModel } from '/src/core/models.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
r.setSize(1200, 400, false);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#556');
scene.add(new THREE.HemisphereLight('#fff', '#444', 2));
const dl = new THREE.DirectionalLight('#fff', 2); dl.position.set(2, 5, 8); scene.add(dl);
const keys = ['model-dog', 'model-archer', 'model-aegis'];
const ms = await Promise.all(keys.map((k) => loadModel(k, { height: 1 })));
ms.forEach((m, i) => { if (!m) return; m.position.x = (i - 1) * 1.8; scene.add(m); 
  // axis helper: +z red stick
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.8), new THREE.MeshBasicMaterial({ color: 'red' })); s.position.set((i - 1) * 1.8, 0.02, 0.4); scene.add(s);
});
const cam = new THREE.PerspectiveCamera(35, 3, 0.1, 50);
const view = new URLSearchParams(location.search).get('v') || 'front';
if (view === 'front') cam.position.set(0, 1.2, 7); // looking from +z toward -z: sees model's +z side
else if (view === 'side') cam.position.set(8, 1.2, 0.01);
else cam.position.set(0, 9, 0.01);
cam.lookAt(0, 0.5, 0);
r.render(scene, cam);
window.__done = true;
</script></body></html>
